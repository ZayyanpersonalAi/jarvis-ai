name: Extract project files
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract live patch zip
        run: |
          unzip -o jarvis-live-patch.zip
          rm -f jarvis-live-patch.zip
          rm -f .github/workflows/extract.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Live: Gemini voice, Supabase appointments, Connections page" || echo "nothing to commit"
          git push
