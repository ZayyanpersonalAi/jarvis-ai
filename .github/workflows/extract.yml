name: Extract project files
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Gemini patch
        run: |
          unzip -o jarvis-gemini-patch.zip
          rm -f jarvis-gemini-patch.zip
          rm -f .github/workflows/extract.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Add Gemini (free) AI support" || echo "Nothing to commit"
          git push
