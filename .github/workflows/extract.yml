name: Extract project files
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract desktop zip
        run: |
          unzip -o jarvis-desktop-upload.zip
          rm -f jarvis-desktop-upload.zip
          rm -f .github/workflows/extract.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Extract desktop app files" || echo "Nothing to commit"
          git push
