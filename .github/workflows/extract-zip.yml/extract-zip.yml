name: Extract uploaded zip

on:
  workflow_dispatch:
    inputs:
      zip:
        description: 'Zip file in repo root to extract'
        required: true
        default: 'jarvis-live-patch3.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit
        run: |
          ls -l *.zip
          unzip -o "${{ inputs.zip }}" -d .
          rm -f "${{ inputs.zip }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Apply ${{ inputs.zip }} (extract over repo root)" || echo "nothing to commit"
          git push
